<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="practice.css">
    <title>practice-site</title>
</head>

<body>
    <input class="login-name" type="text" placeholder="Name">
    <input class="login-email" type="email" placeholder="Email">

    <p class="customer-support">
        Thanks for chatting with our customer support. Would you like to take our quick servey?
    </p>
    <button class="customer-support-button">
        Yes
    </button>

    <button class="customer-support-button">
        No
    </button>

    <img class="google-search" src="google-logo-9834.png">
    <input class="google-search-bar" type="text" placeholder="Search Google or type a URL">


    <input class="sign-up-first" type="text" placeholder="First name">
    <input class="sign-up-last" type="text" placeholder="Last name">
    <input class="sign-up-email" type="email" placeholder="Email">
    <button class="sign-up-button">
        Sign up
    </button>

    <p class="uber-heading">
        Request a ride now
    </p>

    <input class="uber-pick-up" type="text" placeholder="Enter pickup location">
    <input class="uber-destination" type="text" placeholder="Enter distination">

    <button class="uber-request-button">
        Request now
    </button>

    <button class="uber-schedule-button">
        Schedule for later
    </button>

    <div class="square-red">
    </div>

    <div class="circle-green">
    </div>

    <div class="service-feedback">
        <p>
            Satisfied with our service?
        </p>

        <button class="feedback-yes-button">
            Yes
        </button>

        <button class="feedback-no-button">
            No
        </button>
    </div>

    <div class="youtube-music">
        <p class="install-youtube-music">
            Install Youtuube Music
        </p>

        <p class="add-youtube-music">
            Add Youtuube Music to your desktop for quick and easy access
        </p>
    </div>

    <div class="message-box">
        <img class="profile-picture" src="cat.jpg">
        <input type="text" class="text-box" placeholder="What's happening?">
        <button class="tweet-button">
            Tweet
        </button>
    </div>

</body>

</html>
